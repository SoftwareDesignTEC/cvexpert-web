# Version catalog: única fuente de verdad de versiones.
# Verificadas contra los repos el 14/09/2026, no puestas de memoria.
#
# Configuración pedida por DevOps (Cabrera): AGP 8.x, compileSdk 35 y Java 17.
# OJO: varias librerías están FIJADAS en la última versión que acepta compileSdk 35.
# No las subas sin subir antes compileSdk, o el build falla en checkAarMetadata:
#   - coreKtx 1.17+ exige compileSdk 36 (1.19 exige 37)
#   - activityCompose 1.11+ exige compileSdk 36
#   - composeBom 2026.08.00+ trae compose ui 1.12, que exige compileSdk 37
#   - hilt 2.59+ exige AGP 9 (2.58 es la última compatible con AGP 8)
#   - lifecycle 2.11+ exige compileSdk 37 y AGP 9.1
#   - kotlin 2.4+ genera metadatos que Hilt 2.58 no sabe leer (máximo 2.3)
#   - hiltLifecycleViewmodelCompose 1.4+ exige compileSdk 37 y AGP 9.1
[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.12"
hilt = "2.58"
hiltLifecycleViewmodelCompose = "1.3.0"
coreKtx = "1.16.0"
activityCompose = "1.10.1"
lifecycle = "2.10.0"
composeBom = "2026.06.01"
credentials = "1.6.0"
googleid = "1.2.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# hiltViewModel() sin depender de Navigation (la navegación llega en T2).
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewmodelCompose" }

# Login nativo con Google: Credential Manager + Google ID.
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

# El BOM fija de forma coherente las versiones de todas las librerías de Compose.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Con AGP 8 el soporte de Kotlin lo da este plugin (el Kotlin integrado es solo de AGP 9).
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: write          # crear el tag y el release
      pull-requests: write     # comentarios del deploy en los PR
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      # Validacion previa al despliegue: si el analisis estatico o los tipos fallan,
      # el job se detiene aqui y no se publica nada.
      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Verificar tipos
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_MUSHROOM_0CD000A10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/apps/web" # Ruta del código fuente de la app web
          api_location: "" # Api source code path - optional
          output_location: "dist" # Carpeta de salida de compilación para proyectos Vite/React
          ###### End of Repository/Build Configurations ######
        env:
          VITE_APIM_BASE_URL: ${{ vars.APIM_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}

      # La version sale de apps/web/package.json, la misma que la app muestra en el
      # sidebar, de modo que el tag de Git y lo que ve el usuario no puedan divergir.
      - name: Crear tag y release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/web/package.json').version")
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "El release v$VERSION ya existe; no se vuelve a crear."
          else
            gh release create "v$VERSION" --title "v$VERSION" --target "$GITHUB_SHA" --generate-notes
          fi

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_VICTORIOUS_MUSHROOM_0CD000A10 }}
          action: "close"
